project_id = "subscription-management"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false

# Local Passkey / WebAuthn (requires matching loopback origin in the browser).
# Production projects must enable Passkeys in the Supabase Dashboard and set a
# stable RP ID / Origins there — see docs/en/supabase.md.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Subscription Management"
rp_id = "127.0.0.1"
rp_origins = ["http://127.0.0.1:5173"]
