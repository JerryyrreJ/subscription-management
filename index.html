    <meta name="description" content="Personal subscription tracker for recurring bills, spend overview, and payment reminders. Manual and privacy-minded — no bank login required." />
    <link rel="canonical" href="https://sub.jerrylu.xyz/" />

  <body>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { /* Use the default theme if storage is unavailable. */ }
    </script>
    <div id="root"></div>
    <noscript>Subscription Manager helps you track recurring costs and renewal dates. Enable JavaScript to open the app, or explore the <a href="/blog">guides</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
