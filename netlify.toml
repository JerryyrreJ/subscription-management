# Netlify Configuration File
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command
  command = "npm run build"

  # Directory with the build output
  publish = "dist"

  # Directory with the serverless functions
  functions = "netlify/functions"

[build.environment]
  # Node version
  NODE_VERSION = "22"

# Public build settings for the new production domains. Runtime SITE_URL must
# also be set in Netlify's production Functions environment during cutover.
[context.production.environment]
  VITE_SITE_URL = "https://steadyrenew.com"
  VITE_APP_URL = "https://app.steadyrenew.com/"
  VITE_DOCS_URL = "https://docs.steadyrenew.com"

# Preview application links must stay on the preview deployment.
[context.deploy-preview.environment]
  VITE_APP_URL = "/app"

[context.branch-deploy.environment]
  VITE_APP_URL = "/app"

# The old application origin stays available for local-data export, auth
# callbacks, passkeys and existing API clients. Only public blog pages move.
[[redirects]]
  from = "https://sub.jerrylu.xyz/blog"
  to = "https://steadyrenew.com/blog"
  status = 301
  force = true

[[redirects]]
  from = "https://sub.jerrylu.xyz/blog/*"
  to = "https://steadyrenew.com/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sub.jerrylu.xyz/zh/blog"
  to = "https://steadyrenew.com/zh/blog"
  status = 301
  force = true

[[redirects]]
  from = "https://sub.jerrylu.xyz/zh/blog/*"
  to = "https://steadyrenew.com/zh/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.steadyrenew.com/*"
  to = "https://steadyrenew.com/:splat"
  status = 301
  force = true

# Public API routes
[[redirects]]
  from = "/api/v1/subscriptions"
  to = "/.netlify/functions/api-v1-subscriptions"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/subscriptions/*"
  to = "/.netlify/functions/api-v1-subscriptions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/analytics/*"
  to = "/.netlify/functions/api-v1-analytics/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/audit"
  to = "/.netlify/functions/api-v1-audit"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/notification-settings"
  to = "/.netlify/functions/api-v1-notification-settings"
  status = 200
  force = true

# Static blog HTML is emitted into dist/blog and dist/zh/blog at build time.
# Keep these rewrites above the SPA fallback so unknown guide slugs
# 404 instead of serving the React app shell.
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat/index.html"
  status = 200

[[redirects]]
  from = "/zh/blog"
  to = "/zh/blog/index.html"
  status = 200

[[redirects]]
  from = "/zh/blog/*"
  to = "/zh/blog/:splat/index.html"
  status = 200

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Specific headers for Stripe webhook endpoint
[[headers]]
  for = "/.netlify/functions/stripe-webhook"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "stripe-signature"
    Access-Control-Allow-Methods = "POST"

# Prerender Extension Configuration (optional)
# The Prerender extension works automatically, but you can customize if needed
# [[plugins]]
#   package = "@netlify/plugin-prerender"
#   [plugins.inputs]
#     # Specific routes to prerender (if you want to limit)
#     # routes = ["/", "/pricing", "/about"]
#     # User agents to trigger prerendering for (defaults include common crawlers)
#     # userAgents = ["googlebot", "bingbot", "twitterbot"]

# Scheduled Functions Configuration
# For scheduled functions, the schedule is defined in the function file itself
# using the `config` export (Netlify Functions v2). No additional netlify.toml config needed.
# See: netlify/functions/send-scheduled-notifications.ts
